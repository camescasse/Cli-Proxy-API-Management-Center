name: Sync upstream release

# Daily: when router-for-me publishes a new vX.Y.Z tag, merge it into this
# fork's main, check it (no new test failures, lint, build), and publish
# vX.Y.Z-camescasse.1.
# CLIProxyAPI (management.panel-github-repository) then downloads it within 3 hours.
#
# A tag pushed with GITHUB_TOKEN does not start release.yml, so this workflow
# builds and publishes the release itself. A merge conflict or a failed check
# stops the run before anything is pushed or published.
#
# The fork edits upstream's locale files, so they merge key by key
# (.github/scripts/json-merge.mjs) instead of line by line. Upstream's
# per-locale completeness tests are ignored: the fork translates its strings
# only into some locales, and the others fall back.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge, check and build, but do not push or publish
        type: boolean
        default: false
      base:
        description: Branch to merge into (for testing; scheduled runs use main)
        type: string
        default: main

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/router-for-me/Cli-Proxy-API-Management-Center
  FORK_SUFFIX: camescasse
  # Failing tests whose names match this are not counted as added by the merge.
  IGNORED_TESTS: ' locale > covers every current English key'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a new upstream release
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet upstream --tags
          latest="$(git ls-remote --tags --refs upstream 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)"
          echo "Latest upstream release: ${latest}"
          if git merge-base --is-ancestor "refs/tags/${latest}" HEAD; then
            echo "main already contains ${latest}. Nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "tag=${latest}" >> "$GITHUB_OUTPUT"
            echo "release=${latest}-${FORK_SUFFIX}.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.upstream.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge the upstream release
        if: steps.upstream.outputs.new == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Local-only attributes: no committed .gitattributes that could conflict with upstream.
          echo 'src/i18n/locales/*.json merge=localejson' >> .git/info/attributes
          git config merge.localejson.name 'JSON key-by-key merge'
          git config merge.localejson.driver 'node .github/scripts/json-merge.mjs %O %A %B'
          git merge --no-ff --no-edit -m "Merge upstream ${{ steps.upstream.outputs.tag }}" \
            "refs/tags/${{ steps.upstream.outputs.tag }}"

      - name: Setup Bun
        if: steps.upstream.outputs.new == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        if: steps.upstream.outputs.new == 'true'
        run: bun install --frozen-lockfile

      # Upstream main does not always pass its own test suite. Compare against
      # the clean upstream release instead: the merge must not add a failure.
      - name: Test against the upstream baseline
        if: steps.upstream.outputs.new == 'true'
        run: |
          set -uo pipefail
          failing() {
            bun test > "$1" 2>&1 || true
            if ! grep -qE '^Ran [0-9]+ tests' "$1"; then
              echo "The test run did not finish: $1" >&2
              tail -n 20 "$1" >&2
              return 1
            fi
            # No failing tests is a valid result: grep exits 1 on no match.
            { grep -E '^\(fail\) ' "$1" || true; } | sed -E 's/ \[[0-9.]+m?s\]$//' | sort -u
          }
          failing "$RUNNER_TEMP/merged.log" > "$RUNNER_TEMP/merged-fail.txt" || exit 1
          git worktree add --quiet "$RUNNER_TEMP/upstream" "refs/tags/${{ steps.upstream.outputs.tag }}"
          (
            cd "$RUNNER_TEMP/upstream"
            bun install --frozen-lockfile > /dev/null
            failing "$RUNNER_TEMP/upstream.log" > "$RUNNER_TEMP/upstream-fail.txt"
          ) || exit 1
          added="$(comm -23 "$RUNNER_TEMP/merged-fail.txt" "$RUNNER_TEMP/upstream-fail.txt" \
            | grep -vF -- "$IGNORED_TESTS" || true)"
          ignored="$(grep -cF -- "$IGNORED_TESTS" "$RUNNER_TEMP/merged-fail.txt" || true)"
          echo "Ignored locale completeness failures: ${ignored}"
          if [ -n "$added" ]; then
            echo "The merge adds test failures:"
            echo "$added"
            exit 1
          fi
          echo "No new test failures. Upstream baseline failures: $(wc -l < "$RUNNER_TEMP/upstream-fail.txt")"

      - name: Lint
        if: steps.upstream.outputs.new == 'true'
        run: bun run lint

      - name: Build all-in-one HTML
        if: steps.upstream.outputs.new == 'true'
        run: bun run build
        env:
          VERSION: ${{ steps.upstream.outputs.release }}

      - name: Push main and the release tag
        if: steps.upstream.outputs.new == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          release='${{ steps.upstream.outputs.release }}'
          git tag -a "$release" -m "Upstream ${{ steps.upstream.outputs.tag }} with fork changes"
          git push origin HEAD:main
          git push origin "refs/tags/${release}"

      - name: Publish the release
        if: steps.upstream.outputs.new == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release='${{ steps.upstream.outputs.release }}'
          mv dist/index.html dist/management.html
          {
            echo "Upstream ${{ steps.upstream.outputs.tag }} merged with the fork changes."
            echo
            git log --pretty=format:'- %h %s' --no-merges "HEAD^1..HEAD^2"
          } > release-notes.md
          # --repo: gh would otherwise prefer the "upstream" remote added above.
          gh release create "$release" dist/management.html --repo "$GITHUB_REPOSITORY" \
            --title "$release" --notes-file release-notes.md --latest
